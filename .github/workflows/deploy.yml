name: Deploy to GitHub Pages

# ปิดการ deploy อัตโนมัติแล้ว เพราะเว็บมี backend เป็นของตัวเองตั้งแต่รอบนี้
# GitHub Pages เสิร์ฟไฟล์นิ่งอย่างเดียว รัน API ไม่ได้ เว็บที่ขึ้น Pages จะเปิดได้แต่
# โหลดข้อมูลไม่ได้เลย ที่อยู่จริงของเว็บคือ Vercel ซึ่งรัน /api ในโปรเจกต์เดียวกัน
# workflow นี้ยังสั่งรันมือได้ เผื่อต้องการสำเนาไว้ดูหน้าตา
on:
  workflow_dispatch:

# Playwright is intentionally not run here: playwright.config.ts pins
# channel 'msedge', which ubuntu runners do not have.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The site lives at snoppy1.github.io/championway/, not at the root.
          BASE_PATH: /championway/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
