<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone-width preview</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-sans-thai/thai-400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-sans-thai/thai-500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-sans-thai/thai-600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-sans/latin-400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-sans/latin-500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-sans/latin-600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/anuphan/thai-500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/anuphan/thai-600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/anuphan/thai-700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/anuphan/latin-500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/anuphan/latin-600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/anuphan/latin-700.css">
<link rel="stylesheet" href="../../src/styles.css">
</head>
<body>
<div class="top-rule"></div>
<header class="site-header"><div class="shell header-inner">
  <a class="brand-link" href="#"><img class="brand-mark" src="../../src/assets/trophy.png" alt=""><span class="brand-name">ChampionWays</span></a>
  <button type="button" class="icon-button menu-toggle" aria-expanded="true" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="header-menu is-open">
    <nav class="main-nav" aria-label="Main"><a class="active" href="#">Explore</a><a href="#">Mentors</a><span class="nav-soon">Library <small>Soon</small></span></nav>
    <div class="header-actions" id="actions"></div>
  </div>
</div></header>
<main>
  <div id="hall"></div>
  <div class="shell" style="padding-block:var(--space-8) var(--space-8)">
    <div class="rs-section"><div class="rs-section-head"><h2 id="rt"></h2></div><p class="rs-section-sub" id="rsub"></p><div id="ranked"></div></div>
    <div class="rs-section"><div id="plain"></div></div>
    <div id="upsell" style="margin-top:var(--space-8)"></div>
  </div>
</main>
<script src="demo.js"></script>
<script>
  const lang = new URLSearchParams(location.search).get('lang') === 'th' ? 'th' : 'en';
  document.documentElement.lang = lang;
  const t = RS.T[lang];
  document.getElementById('actions').innerHTML = RS.langToggle(lang) + '<a class="ghost-button" href="#">' + (lang === 'th' ? 'เข้าสู่ระบบ' : 'Sign in') + '</a><a class="primary-button" href="#">' + (lang === 'th' ? 'สมัครสมาชิก' : 'Sign up') + '</a>';
  document.getElementById('hall').innerHTML = RS.hall(lang, 'p', false);
  document.getElementById('rt').textContent = t.rankedTitle;
  document.getElementById('rsub').textContent = t.rankedSub;
  document.getElementById('ranked').innerHTML = RS.ranked(lang, 2);
  document.getElementById('plain').innerHTML = RS.plain(lang, 1);
  document.getElementById('upsell').innerHTML = RS.upsell(lang, 'pu', 'invalid', false);
  RS.fold(document);
  // second past month expanded so both fold states show
  const b = document.querySelector('.rs-fold__toggle'); b.click();
</script>
</body>
</html>
